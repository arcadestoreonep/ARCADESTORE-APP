<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101016">
  <meta name="description" content="Verified game accounts from Arcade Store.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arcade Store">
  <title>Arcade Store — Game accounts, made easy</title>
  <link rel="icon" href="./assets/arcade-mark.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="icon" href="./assets/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="./assets/icons/icon-512.png" sizes="512x512" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="flow-scene" aria-hidden="true"><div class="flow-plane flow-plane-back"></div><div class="flow-plane flow-plane-front"></div></div>
  <div id="offline-status" class="offline-status" role="status" aria-live="polite" hidden>You’re offline. Arcade Store is open, but live listings, sign-in, and payments need a connection.</div>
  <header class="topbar"><a class="brand" href="#home" aria-label="Arcade Store home"><img src="./assets/arcade-mark.svg" alt="" width="34" height="34"><span>ARCADE<span class="brand-light">STORE</span></span></a><div class="top-actions"><button class="icon-button" data-action="help" aria-label="Help">?</button><button class="avatar" data-nav="account" aria-label="Account">A</button></div></header>
  <main id="app" tabindex="-1" aria-live="polite"></main>
  <nav id="bottom-nav" class="bottom-nav" aria-label="Main navigation" hidden></nav>
  <div id="toast-region" class="toast-region" aria-live="assertive"></div>
  <script src="./config.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
