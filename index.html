<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b0b">

  <link rel="icon" href="./assets/arcade-mark.svg" type="image/svg+xml">
